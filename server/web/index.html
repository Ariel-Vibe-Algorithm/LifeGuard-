<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060D1A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="LifeGuard - קריאת חירום, ליווי הביתה ומעגל ביטחון">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- default: dark status-bar text over the light translucent navigation bar (dark mode: the system switches it).
       .topbar still pads by env(safe-area-inset-top) (viewport-fit=cover, landscape, iPad). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeGuard">
  <!-- iOS would turn numbers (codes, coordinates) into phone links; the real tel: links are explicit -->
  <meta name="format-detection" content="telephone=no">
  <title>LifeGuard</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/app/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/app/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/app/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/app/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/app/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/app/apple-touch-icon-120.png">
  <link rel="stylesheet" href="/app/app.css">
  <script type="module" src="/app/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="lg-mark-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A4485"/><stop offset="1" stop-color="#0A1F44"/></linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="url(#lg-mark-bg)"/>
        <path d="M16 5.6 8.6 8.5v5.7c0 4.8 3.1 8.8 7.4 10.2 4.3-1.4 7.4-5.4 7.4-10.2V8.5z" fill="#fff"/>
        <path d="M14.6 10.6h2.8v3.3h3.3v2.8h-3.3V20h-2.8v-3.3h-3.3v-2.8h3.3z" fill="#D70015"/>
      </svg>
      <span>LifeGuard</span>
    </div>
    <div class="top-actions">
      <div class="whoami" id="whoami"></div>
      <button type="button" class="sos-mini" id="sos-mini" data-test="sos-mini" aria-label="קריאת חירום SOS - פותח אישור" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.2 2.6 19.5h18.8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 9.5v4.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.9" r="1.3" fill="currentColor"/></svg>SOS</button>
    </div>
  </header>
  <div id="conn" class="conn" role="status" aria-live="polite" hidden></div>
  <div id="notices" aria-live="assertive"></div>
  <main id="view">
    <div class="card"><p>טוען...</p></div>
    <noscript><div class="card danger"><p>LifeGuard דורש JavaScript. בחירום חייג/י 100 / 101 / 112.</p></div></noscript>
  </main>
  <nav class="tabs" id="tabs" aria-label="ניווט ראשי" hidden>
    <button type="button" data-tab="home" data-test="tab-home"><span class="ico" aria-hidden="true"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path class="f" d="M4.5 12.6 14 4.8l9.5 7.8V22a1.5 1.5 0 0 1-1.5 1.5h-5v-6.5h-6v6.5H6A1.5 1.5 0 0 1 4.5 22z"/></svg></span>בית</button>
    <button type="button" data-tab="map" data-test="tab-map"><span class="ico" aria-hidden="true"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path class="f" d="M3.8 7.2 10 4.6l8 2.8 6.2-2.6v16l-6.2 2.6-8-2.8-6.2 2.6z"/><path class="k" d="M10 4.6v16M18 7.4v16"/></svg></span>סביבה</button>
    <button type="button" data-tab="community" data-test="tab-community"><span class="ico" aria-hidden="true"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><circle class="f" cx="10.5" cy="9.5" r="3.6"/><path class="f" d="M3.5 22.5c0-4 3.1-6.6 7-6.6s7 2.6 7 6.6z"/><circle class="f" cx="19.5" cy="10.5" r="2.9"/><path d="M19.2 15.9c3.1.2 5.3 2.4 5.3 5.6h-4.3"/></svg></span>קהילה</button>
    <button type="button" data-tab="circle" data-test="tab-circle"><span class="ico" aria-hidden="true"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path class="f" d="M14 3.8 5.5 7v6.4c0 5.3 3.6 9.6 8.5 11 4.9-1.4 8.5-5.7 8.5-11V7z"/></svg></span>מעגל ביטחון</button>
    <button type="button" data-tab="profile" data-test="tab-profile"><span class="ico" aria-hidden="true"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><circle cx="14" cy="14" r="10.5"/><circle class="f" cx="14" cy="11.5" r="3.7"/><path class="f" d="M7.6 21.2c1.5-2.6 3.8-3.9 6.4-3.9s4.9 1.3 6.4 3.9"/></svg></span>פרופיל</button>
  </nav>
</body>
</html>
