# LifeGuard: שרת + Caddy (HTTPS אוטומטי מ-Let's Encrypt).
# הפעלה על השרת:  cp deploy/.env.example deploy/.env  (למלא!)  ואז
#                 docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  lifeguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      LIFEGUARD_PUBLIC_URL: https://${LIFEGUARD_DOMAIN}
      LIFEGUARD_DATA_KEY: ${LIFEGUARD_DATA_KEY}
      LIFEGUARD_ADMIN_TOKEN: ${LIFEGUARD_ADMIN_TOKEN}
      LIFEGUARD_ACK_TIMEOUT_SECONDS: ${LIFEGUARD_ACK_TIMEOUT_SECONDS:-120}
      LIFEGUARD_TWILIO_ACCOUNT_SID: ${LIFEGUARD_TWILIO_ACCOUNT_SID:-}
      LIFEGUARD_TWILIO_AUTH_TOKEN: ${LIFEGUARD_TWILIO_AUTH_TOKEN:-}
      LIFEGUARD_TWILIO_FROM: ${LIFEGUARD_TWILIO_FROM:-}
      LIFEGUARD_TWILIO_VERIFY_SID: ${LIFEGUARD_TWILIO_VERIFY_SID:-}
      LIFEGUARD_BEHIND_PROXY: "1"
      # זמן הגעה בהליכה למתנדבים - רק מול OSRM *שלנו* (מיקום של אדם במצוקה לא יוצא לשירות חיצוני).
      # ריק = הערכה (קו אוויר x מקדם עיקוף). להפעלה: docker compose --profile routing up -d
      LIFEGUARD_OSRM_URL: ${LIFEGUARD_OSRM_URL:-}
      # השכמת אנדרואיד (FCM): נתיב *בתוך הקונטיינר* לקובץ חשבון השירות של Firebase. ריק = לא מוגדר.
      LIFEGUARD_FCM_SERVICE_ACCOUNT: ${LIFEGUARD_FCM_SERVICE_ACCOUNT:-}
    volumes:
      - lifeguard-data:/data
      - ./secrets:/run/lifeguard-secrets:ro     # firebase-service-account.json (לא נכנס ל-git)
    expose:
      - "8765"          # לא נחשף לאינטרנט - רק Caddy מדבר איתו

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [lifeguard]
    ports:
      - "80:80"
      - "443:443"
    environment:
      LIFEGUARD_DOMAIN: ${LIFEGUARD_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # אופציונלי: ניתוב הליכה עצמי. הכנת הנתונים פעם אחת (ראו DEPLOY_HE.md, "זמן הגעה בהליכה"):
  #   מפת ישראל מ-Geofabrik (israel-and-palestine-latest.osm.pbf, רישיון ODbL) -> osrm-extract -p foot ->
  #   osrm-partition -> osrm-customize, לתוך deploy/osrm/. ואז LIFEGUARD_OSRM_URL=http://osrm:5000
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/israel-and-palestine-latest.osrm
    volumes:
      - ./osrm:/data:ro
    expose:
      - "5000"          # פנימי בלבד

volumes:
  lifeguard-data:
  caddy-data:
  caddy-config:
